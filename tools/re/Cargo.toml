[package]
name = "re-corpus"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
default-run = "re"

[[bin]]
name = "re"
path = "src/main.rs"

[[bin]]
name = "corpus-registry"
path = "src/bin/corpus-registry.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
